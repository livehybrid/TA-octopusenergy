services:
  splunk:
    image: splunk/splunk:10.0
    container_name: ta_octopusenergy_splunk
    hostname: splunk
    environment:
      SPLUNK_START_ARGS: --accept-license
      SPLUNK_GENERAL_TERMS: --accept-sgt-current-at-splunk-com
      SPLUNK_PASSWORD: ${SPLUNK_PASSWORD:-Changeme1!}
      SPLUNK_HEC_TOKEN: ""
    ports:
      # Fixed ports so the suite can hit https://127.0.0.1:8089 directly.
      # On a CI runner nothing else contends for these.
      - "8000:8000"
      - "8089:8089"
    volumes:
      # The built add-on is bind-mounted live from ../stage so a rebuild on the
      # host updates the running container. The stage/ copy is a throwaway test
      # build (widened perms), never the packaged artefact.
      - ../stage/TA-octopusenergy:/opt/splunk/etc/apps/TA-octopusenergy
    depends_on:
      mock:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsk", "https://localhost:8089/services/server/info", "-u", "admin:${SPLUNK_PASSWORD:-Changeme1!}"]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 30s

  mock:
    # Deterministic stand-in for the Octopus (Kraken) API — no real account or
    # energy data. The collectors reach it via the local/octopus_api_base override
    # file written into stage/ in the CI build step (splunkd does not pass env
    # vars to modular-input processes).
    build: ./mock
    container_name: ta_octopusenergy_mock
    hostname: mock
    expose:
      - "8080"
